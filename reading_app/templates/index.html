<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LerenLezen</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="container">
    <div class="topbar">
      <div>WPM: <span id="wpm">0</span></div>
      <div>Words left: <span id="words-left">0</span></div>
    </div>

    <section class="word-panel">
      <div id="current-word" class="word">...</div>
    </section>

    <section class="score-panel">
      <div class="score-block">
        <div class="label">Good</div>
        <div id="good-checks" class="icon-row"></div>
      </div>

      <div class="score-block">
        <div class="label">Bad</div>
        <div id="bad-checks" class="icon-row"></div>
      </div>

      <div class="score-block">
        <div class="label">Stars</div>
        <div id="stars" class="icon-row"></div>
      </div>

      <div class="score-block">
        <div class="label">Sad</div>
        <div id="sads" class="icon-row"></div>
      </div>
    </section>

    <section class="buttons">
      <button id="wrong-btn" class="wrong">Wrong</button>
      <button id="correct-btn" class="correct">Correct</button>
    </section>

    <section class="buttons secondary">
      <button id="reset-btn">Reset</button>
    </section>

    <p class="hint">Keyboard: left arrow = wrong, right arrow = correct</p>
  </main>

  <script>
    window.APP_ICONS = {
      greenCheck: "{{ url_for('static', filename='icons/green_check.png') }}",
      redCheck: "{{ url_for('static', filename='icons/red_check.png') }}",
      star: "{{ url_for('static', filename='icons/star.jpg') }}",
      sad: "{{ url_for('static', filename='icons/sad.png') }}"
    };
  </script>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
